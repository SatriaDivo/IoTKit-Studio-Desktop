name: Desktop checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
