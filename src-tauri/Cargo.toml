[package]
name = "iotkit-studio-desktop"
version = "0.1.0"
description = "IoTKit Studio local desktop workspace"
authors = ["IoTKit Studio"]
edition = "2021"

[lib]
name = "iotkit_studio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["cors"] }
